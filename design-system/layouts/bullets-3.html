<!DOCTYPE html><html><head><meta charset="utf-8"><style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'Microsoft YaHei','思源黑体','PingFang SC',sans-serif; background:var(--bg); color:var(--text); width:100%; height:100vh; overflow:hidden; }
  .page { width:100%; height:100vh; padding:60px 70px; position:relative; }
  .pagetitle { font-size:30px; font-weight:700; color:var(--primary); margin-bottom:14px; }
  .pagesub { font-size:15px; color:var(--text-muted); margin-bottom:36px; }
  
  .list { margin-top:10px; }
  .item { display:flex; gap:24px; align-items:baseline; padding:16px 0; }
  .num { font-size:34px; font-weight:700; color:var(--accent-light); min-width:56px; }
  .item h3 { font-size:19px; font-weight:600; color:var(--primary); margin-bottom:6px; }
  .item p { font-size:14px; color:var(--text-muted); line-height:1.6; }

</style></head><body><div class="page"><h2 class="pagetitle">{{页标题}}</h2><p class="pagesub">{{页副标题}}</p>
  <div class="list">
    <div class="item"><div class="num">01</div><div><h3>{{要点标题一}}</h3><p>{{要点内容一}}</p></div></div>
    <div class="item"><div class="num">02</div><div><h3>{{要点标题二}}</h3><p>{{要点内容二}}</p></div></div>
    <div class="item"><div class="num">03</div><div><h3>{{要点标题三}}</h3><p>{{要点内容三}}</p></div></div>
  </div></div></body></html>
