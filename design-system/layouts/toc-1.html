<!DOCTYPE html><html><head><meta charset="utf-8"><style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'Microsoft YaHei','思源黑体','PingFang SC',sans-serif; background:var(--bg); color:var(--text); width:100%; height:100vh; overflow:hidden; }
  .page { width:100%; height:100vh; padding:60px 70px; position:relative; }
  
  .page { padding-top:80px; }
  h2 { font-size:32px; font-weight:700; color:var(--primary); margin-bottom:48px; }
  .item { display:flex; align-items:center; gap:24px; padding:18px 0; border-bottom:1px solid var(--bg-muted); }
  .num { font-size:28px; font-weight:700; color:var(--accent); min-width:52px; }
  .title { font-size:20px; font-weight:600; color:var(--primary); }

</style></head><body><div class="page"><h2>{{目录标题}}</h2>
  <div class="item"><div class="num">01</div><div class="title">{{章节一}}</div></div>
  <div class="item"><div class="num">02</div><div class="title">{{章节二}}</div></div>
  <div class="item"><div class="num">03</div><div class="title">{{章节三}}</div></div>
  <div class="item"><div class="num">04</div><div class="title">{{章节四}}</div></div></div></body></html>
