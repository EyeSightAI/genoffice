<!DOCTYPE html><html><head><meta charset="utf-8"><style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'Microsoft YaHei','思源黑体','PingFang SC',sans-serif; background:var(--bg); color:var(--text); width:100%; height:100vh; overflow:hidden; }
  .page { width:100%; height:100vh; padding:60px 70px; position:relative; }
  .pagetitle { font-size:30px; font-weight:700; color:var(--primary); margin-bottom:14px; }
  .pagesub { font-size:15px; color:var(--text-muted); margin-bottom:36px; }
  
  .grid { display:grid; grid-template-columns:repeat(3,1fr); gap:20px; margin-top:20px; }
  .metric { background:var(--bg-muted); border-radius:12px; padding:32px 26px; text-align:center; }
  .value { font-size:52px; font-weight:700; color:var(--accent); line-height:1; margin-bottom:10px; }
  .label { font-size:15px; color:var(--primary); font-weight:600; margin-bottom:6px; }
  .note { font-size:13px; color:var(--text-muted); }

</style></head><body><div class="page"><h2 class="pagetitle">{{页标题}}</h2><p class="pagesub">{{页副标题}}</p>
  <div class="grid">
    <div class="metric"><div class="value">{{数值一}}</div><div class="label">{{指标一}}</div><div class="note">{{说明一}}</div></div>
    <div class="metric"><div class="value">{{数值二}}</div><div class="label">{{指标二}}</div><div class="note">{{说明二}}</div></div>
    <div class="metric"><div class="value">{{数值三}}</div><div class="label">{{指标三}}</div><div class="note">{{说明三}}</div></div>
  </div></div></body></html>
