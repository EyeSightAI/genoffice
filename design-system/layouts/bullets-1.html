<!DOCTYPE html><html><head><meta charset="utf-8"><style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'Microsoft YaHei','思源黑体','PingFang SC',sans-serif; background:var(--bg); color:var(--text); width:100%; height:100vh; overflow:hidden; }
  .page { width:100%; height:100vh; padding:60px 70px; position:relative; }
  .pagetitle { font-size:30px; font-weight:700; color:var(--primary); margin-bottom:14px; }
  .pagesub { font-size:15px; color:var(--text-muted); margin-bottom:36px; }
  
  .grid { display:grid; grid-template-columns:repeat(3,1fr); gap:20px; margin-top:10px; }
  .card { background:var(--bg-muted); border-radius:12px; padding:26px; }
  .icon { width:44px; height:44px; border-radius:10px; background:var(--accent); color:#fff; display:flex; align-items:center; justify-content:center; font-size:20px; font-weight:700; margin-bottom:16px; }
  .card h3 { font-size:18px; font-weight:600; color:var(--primary); margin-bottom:10px; }
  .card p { font-size:14px; color:var(--text-muted); line-height:1.6; }

</style></head><body><div class="page"><h2 class="pagetitle">{{页标题}}</h2><p class="pagesub">{{页副标题}}</p>
  <div class="grid">
    <div class="card"><div class="icon">{{1}}</div><h3>{{要点标题一}}</h3><p>{{要点内容一}}</p></div>
    <div class="card"><div class="icon">{{2}}</div><h3>{{要点标题二}}</h3><p>{{要点内容二}}</p></div>
    <div class="card"><div class="icon">{{3}}</div><h3>{{要点标题三}}</h3><p>{{要点内容三}}</p></div>
  </div></div></body></html>
