<!DOCTYPE html><html><head><meta charset="utf-8"><style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'Microsoft YaHei','思源黑体','PingFang SC',sans-serif; background:var(--bg); color:var(--text); width:100%; height:100vh; overflow:hidden; }
  .page { width:100%; height:100vh; padding:60px 70px; position:relative; }
  
  .page { padding:0; overflow:hidden; }
  img.bg { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  .overlay { position:absolute; inset:0; background:linear-gradient(to top, rgba(15,42,74,0.9) 0%, rgba(15,42,74,0.35) 50%, transparent 100%); }
  .txt { position:absolute; left:70px; bottom:70px; color:#fff; }
  .kicker { font-size:14px; letter-spacing:3px; opacity:0.85; margin-bottom:14px; }
  h1 { font-size:50px; font-weight:700; line-height:1.15; margin-bottom:18px; }
  .subtitle { font-size:17px; opacity:0.9; }

</style></head><body><div class="page"><img class="bg" src="{{背景图URL}}"><div class="overlay"></div>
  <div class="txt">
    <div class="kicker">{{分类标签}}</div>
    <h1>{{主标题}}</h1>
    <p class="subtitle">{{副标题}}</p>
  </div></div></body></html>
