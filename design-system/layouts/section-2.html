<!DOCTYPE html><html><head><meta charset="utf-8"><style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'Microsoft YaHei','思源黑体','PingFang SC',sans-serif; background:var(--bg); color:var(--text); width:100%; height:100vh; overflow:hidden; }
  .page { width:100%; height:100vh; padding:60px 70px; position:relative; }
  
  .page { background:var(--primary); color:#fff; display:flex; flex-direction:column; justify-content:center; padding:60px 80px; }
  .num { font-size:16px; letter-spacing:4px; opacity:0.6; margin-bottom:20px; }
  .title { font-size:44px; font-weight:700; margin-bottom:18px; }
  .desc { font-size:17px; opacity:0.8; line-height:1.6; }
  .bar { width:56px; height:5px; background:var(--accent-light); border-radius:3px; margin-bottom:24px; }

</style></head><body><div class="page"><div class="num">{{章节编号}}</div>
  <div class="bar"></div>
  <h2 class="title">{{章节标题}}</h2>
  <p class="desc">{{章节简介}}</p></div></body></html>
