<!DOCTYPE html><html><head><meta charset="utf-8"><style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'Microsoft YaHei','思源黑体','PingFang SC',sans-serif; background:var(--bg); color:var(--text); width:100%; height:100vh; overflow:hidden; }
  .page { width:100%; height:100vh; padding:60px 70px; position:relative; }
  
  .page { display:flex; flex-direction:column; justify-content:center; }
  .bar { width:64px; height:6px; background:var(--accent); border-radius:3px; margin-bottom:28px; }
  .kicker { font-size:14px; letter-spacing:3px; color:var(--accent); margin-bottom:16px; }
  h1 { font-size:54px; font-weight:700; color:var(--primary); line-height:1.15; margin-bottom:28px; }
  .subtitle { font-size:18px; color:var(--text-muted); line-height:1.7; margin-bottom:48px; }
  .meta { display:flex; gap:36px; font-size:14px; color:var(--text-muted); }

</style></head><body><div class="page"><div class="bar"></div>
  <div class="kicker">{{分类标签}}</div>
  <h1>{{主标题}}</h1>
  <p class="subtitle">{{副标题 / 一句话说明}}</p>
  <div class="meta"><span>{{演讲者 / 公司}}</span><span>{{日期}}</span></div></div></body></html>
