<!DOCTYPE html><html><head><meta charset="utf-8"><style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'Microsoft YaHei','思源黑体','PingFang SC',sans-serif; background:var(--bg); color:var(--text); width:100%; height:100vh; overflow:hidden; }
  .page { width:100%; height:100vh; padding:60px 70px; position:relative; }
  
  .page { display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center; }
  .line { width:120px; height:2px; background:var(--accent); }
  .kicker { font-size:13px; letter-spacing:4px; color:var(--text-muted); margin:28px 0 16px; }
  h1 { font-size:50px; font-weight:700; color:var(--primary); line-height:1.2; margin-bottom:24px; }
  .subtitle { font-size:17px; color:var(--text-muted); line-height:1.6; }

</style></head><body><div class="page"><div class="line"></div>
  <div class="kicker">{{分类标签}}</div>
  <h1>{{主标题}}</h1>
  <p class="subtitle">{{副标题}}</p></div></body></html>
