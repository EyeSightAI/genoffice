<!DOCTYPE html><html><head><meta charset="utf-8"><style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'Microsoft YaHei','思源黑体','PingFang SC',sans-serif; background:var(--bg); color:var(--text); width:100%; height:100vh; overflow:hidden; }
  .page { width:100%; height:100vh; padding:60px 70px; position:relative; }
  
  .page { display:flex; align-items:center; gap:48px; }
  .num { font-size:120px; font-weight:700; color:var(--accent-light); line-height:1; opacity:0.5; }
  .title { font-size:42px; font-weight:700; color:var(--primary); margin-bottom:16px; }
  .desc { font-size:16px; color:var(--text-muted); line-height:1.6; }

</style></head><body><div class="page"><div class="num">{{章节编号}}</div>
  <div><h2 class="title">{{章节标题}}</h2><p class="desc">{{章节简介}}</p></div></div></body></html>
