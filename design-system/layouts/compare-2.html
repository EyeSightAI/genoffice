<!DOCTYPE html><html><head><meta charset="utf-8"><style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'Microsoft YaHei','思源黑体','PingFang SC',sans-serif; background:var(--bg); color:var(--text); width:100%; height:100vh; overflow:hidden; }
  .page { width:100%; height:100vh; padding:60px 70px; position:relative; }
  .pagetitle { font-size:30px; font-weight:700; color:var(--primary); margin-bottom:14px; }
  .pagesub { font-size:15px; color:var(--text-muted); margin-bottom:36px; }
  
  table { width:100%; border-collapse:collapse; margin-top:16px; }
  th, td { padding:16px 18px; text-align:left; font-size:15px; }
  th { background:var(--primary); color:#fff; font-weight:600; }
  th:first-child { border-radius:8px 0 0 0; }
  th:last-child { border-radius:0 8px 0 0; }
  td { border-bottom:1px solid var(--bg-muted); }
  tr td:first-child { font-weight:600; color:var(--primary); }
  .yes { color:var(--accent); font-weight:700; }
  .no { color:var(--text-muted); }

</style></head><body><div class="page"><h2 class="pagetitle">{{页标题}}</h2><p class="pagesub">{{页副标题}}</p>
  <table>
    <tr><th>{{对比维度}}</th><th>{{方案甲}}</th><th>{{方案乙}}</th></tr>
    <tr><td>{{维度一}}</td><td>{{甲一}}</td><td>{{乙一}}</td></tr>
    <tr><td>{{维度二}}</td><td>{{甲二}}</td><td>{{乙二}}</td></tr>
    <tr><td>{{维度三}}</td><td>{{甲三}}</td><td>{{乙三}}</td></tr>
    <tr><td>{{维度四}}</td><td>{{甲四}}</td><td>{{乙四}}</td></tr>
  </table></div></body></html>
