name: Build Windows Installer

# Builds the UToOffice Windows installer (NSIS .exe) on a Windows runner.
# Trigger manually (workflow_dispatch) or by pushing a v* tag.
# The installer is published to GitHub Releases, mirrored to the UTO update
# server (https://uto-office.cn/update/), and pushed to the Chengdu OSS bucket
# via the server-side deploy_oss.py post-deploy script.

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

concurrency:
  group: win-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable branch, 2026-07
        with:
          toolchain: stable

      - name: Cache cargo (xlsx-sidecar)
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: apps/sheets/native/xlsx-engine

      # electron's postinstall downloads its binary from GitHub Releases on every
      # fresh install; a cache hit skips the download (and its 5xx flakes). The
      # electron-* prefix also holds electron-builder's NSIS/winCodeSign cache,
      # shared with the ci.yml electron-bin-* entry for ~/.cache/electron.
      - name: Cache electron + electron-builder
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: electron-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      # electron-builder's beforePack asserts the xlsx-sidecar exists (it exits 0
      # on a missing extraResources source, which would ship Sheets dead). Build
      # it host-native (MSVC, statically linked per .cargo/config.toml) before
      # packaging so the win sidecar candidate resolves.
      - name: Build xlsx-sidecar
        run: npm run native:build -w @genoffice/sheets

      - name: Build Windows installer
        run: npm run dist:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GENOFFICE_UPDATE_URL: https://uto-office.cn/update/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            apps/shell/release/*.exe
            apps/shell/release/latest.yml

      - name: Sync to server mirror (国内更新加速)
        shell: bash
        run: |
          python -m pip install paramiko -q
          python -c "
          import paramiko
          c = paramiko.SSHClient()
          c.set_missing_host_key_policy(paramiko.AutoAddPolicy())
          c.connect('${{ secrets.SERVER_HOST }}', username='${{ secrets.SERVER_USER }}', password='${{ secrets.SERVER_PASSWORD }}')
          sftp = c.open_sftp()
          for f in ['apps/shell/release/latest.yml', 'apps/shell/release/UToOffice-Setup.exe']:
              sftp.put(f, '/www/wwwroot/update/' + f.split('/')[-1])
          sftp.close()
          # server-side post-deploy: upload installer to chengdu OSS (internal, fast)
          # and point latest.yml url at the OSS installer (packaging overwrites it to relative)
          stdin, stdout, stderr = c.exec_command('/www/server/pyporject_evn/versions/3.10.14/bin/python3 /www/wwwroot/update/deploy_oss.py')
          print(stdout.read().decode())
          err = stderr.read().decode()
          if err.strip(): print('STDERR:', err)
          c.close()
          print('sync + OSS deploy done')
          "

      - name: Upload installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: utooffice-windows-installer
          path: |
            apps/shell/release/*.exe
            apps/shell/release/*.yml
          retention-days: 14
