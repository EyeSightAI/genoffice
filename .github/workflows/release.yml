name: Build Windows Installer

# Builds the UToOffice Windows installer (NSIS .exe) on a Windows runner.
# Trigger manually (workflow_dispatch) or by pushing a v* tag.

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

concurrency:
  group: win-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Rust (MSVC host)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Cache cargo (xlsx-sidecar)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/sheets/native/xlsx-engine

      - name: Install dependencies
        run: npm ci

      - name: Build Windows installer
        run: npm run dist:win
        env:
          # No GA4 credentials → analytics disabled in the packaged app.
          # Set GENOFFICE_UPDATE_URL when an update channel exists.

      - name: List artifacts
        shell: bash
        run: ls -la apps/shell/release/ 2>/dev/null || find . -name '*.exe' -path '*release*' 2>/dev/null

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: utooffice-windows-installer
          path: |
            apps/shell/release/*.exe
            apps/shell/release/*.yml
          retention-days: 14
